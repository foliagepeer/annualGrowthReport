<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>年度成长报告</title>
<link rel="stylesheet" href="vendor/animate.min.css">
<link rel="stylesheet" href="vendor/swiper-bundle.min.css">
<link rel="stylesheet" href="style.css?v=20261112b">
</head>
<body>

<!-- 登录页 -->
<section id="loginScreen" class="screen login">
  <div class="login-inner">
    <p class="login-kicker" data-animate="fadeInDown">ANNUAL REPORT</p>
    <h1 class="login-title" data-animate="fadeInUp" data-delay="120ms">年度成长报告</h1>
    <p id="loginPreface" class="login-desc login-preface" data-animate="fadeInUp" data-delay="240ms">输入学号与密码，打开属于你的这一年</p>

    <form id="loginForm" class="login-form" novalidate>
      <input id="studentId" class="field" type="text" inputmode="numeric" autocomplete="username"
             placeholder="学号" maxlength="32" required>
      <input id="password" class="field" type="password" autocomplete="current-password"
             placeholder="密码" maxlength="64" required>
      <p id="loginError" class="login-error" role="alert" hidden></p>
      <button id="loginBtn" class="login-btn" type="submit">进入报告</button>
    </form>
    <p class="login-tip">初始密码为学号后六位，登录后可在报告最后一页修改</p>
  </div>
</section>

<!-- 报告页 -->
<div id="reportScreen" class="screen report" hidden>
  <button id="musicToggle" class="music-toggle" type="button" aria-label="播放背景音乐" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 17V5l10-2v12" />
      <circle cx="6.5" cy="17.5" r="2.5" />
      <circle cx="16.5" cy="15.5" r="2.5" />
    </svg>
  </button>
  <audio id="bgm" loop preload="auto"></audio>

  <div id="previewBadge" class="preview-badge" hidden>管理员预览</div>

  <div class="decor-layer" aria-hidden="true">
    <svg class="note note-1" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l9-2v3.2L11 9.1V18"/><ellipse cx="7.2" cy="18" rx="3" ry="2.4"/></svg>
    <svg class="note note-2" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l9-2v3.2L11 9.1V18"/><ellipse cx="7.2" cy="18" rx="3" ry="2.4"/></svg>
    <svg class="note note-3" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l9-2v3.2L11 9.1V18"/><ellipse cx="7.2" cy="18" rx="3" ry="2.4"/></svg>
    <svg class="note note-4" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l9-2v3.2L11 9.1V18"/><ellipse cx="7.2" cy="18" rx="3" ry="2.4"/></svg>
    <svg class="note note-5" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l9-2v3.2L11 9.1V18"/><ellipse cx="7.2" cy="18" rx="3" ry="2.4"/></svg>
    <svg class="note note-6" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l9-2v3.2L11 9.1V18"/><ellipse cx="7.2" cy="18" rx="3" ry="2.4"/></svg>
    <span class="spark spark-1"></span>
    <span class="spark spark-2"></span>
    <span class="spark spark-3"></span>
    <span class="spark spark-4"></span>
    <span class="spark spark-5"></span>
    <span class="spark spark-6"></span>
    <span class="spark spark-7"></span>
    <span class="spark spark-8"></span>
  </div>

  <div id="endingActions" class="btn-row" data-animate="fadeIn" data-delay="800ms" hidden>
    <button id="changePasswordBtn" class="btn-ghost" type="button">修改密码</button>
    <button id="logoutBtn" class="btn-ghost" type="button">退出登录</button>
  </div>

  <div class="swiper" id="reportSwiper">
    <div class="swiper-wrapper"></div>
    <div class="swiper-pagination"></div>
  </div>
</div>

<!-- 修改密码页 -->
<section id="passwordScreen" class="screen login" hidden>
  <div class="login-inner">
    <h2 class="login-title" data-animate="fadeInUp">修改密码</h2>
    <p class="login-desc" data-animate="fadeInUp" data-delay="120ms">改完之后，其他设备上的登录会失效</p>

    <form id="passwordForm" class="login-form" novalidate>
      <input id="oldPassword" class="field" type="password" autocomplete="current-password"
             placeholder="当前密码" maxlength="64" required>
      <input id="newPassword" class="field" type="password" autocomplete="new-password"
             placeholder="新密码（6-64 位）" maxlength="64" required>
      <input id="confirmPassword" class="field" type="password" autocomplete="new-password"
             placeholder="再输一次新密码" maxlength="64" required>
      <p id="passwordError" class="login-error" role="alert" hidden></p>
      <p id="passwordOk" class="form-ok" role="status" hidden></p>
      <button id="passwordBtn" class="login-btn" type="submit">保存新密码</button>
      <button id="passwordBack" class="btn-ghost" type="button">返回报告</button>
    </form>
  </div>
</section>

<script src="vendor/swiper-bundle.min.js"></script>
<script src="app.js?v=20261112b"></script>
</body>
</html>
